services:
  - type: web
    name: skilloriya-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: python manage.py seed_demo_jobs && python manage.py seed_demo_applications && gunicorn core.wsgi:application
    disk:
      name: media
      mountPath: /opt/render/project/src/backend/media
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "127.0.0.1,localhost,.onrender.com"
      - key: USE_SQLITE
        value: "False"
      - key: DB_NAME
        fromDatabase:
          name: skilloriya-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: skilloriya-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: skilloriya-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: skilloriya-db
          property: host
      - key: DB_PORT
        value: "5432"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FRONTEND_URL
        sync: false

databases:
  - name: skilloriya-db
    plan: free
    databaseName: skilloriya
